name: offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m unittest discover -s modules/m00-software/labs/reference -p "test_*.py" -v
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        working-directory: projects/p03_tool_agent/seed
      - run: python -m projects.p06_capstone.evaluate
      - run: python tools/check_repo.py
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'mcp==2.3.0'
      - run: python -m unittest tests.test_mcp -v
